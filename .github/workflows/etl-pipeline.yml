name: Prayer Times ETL Pipeline

on:
  # Runs automatically on the 25th of every month at Midnight UTC
  schedule:
    - cron: '0 0 25 * *' 
  
  # This magic line adds a "Run workflow" button in GitHub so you can click it manually!
  workflow_dispatch: 

jobs:
  run-data-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Grab your code from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup a Python environment on the GitHub server
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install the required Python libraries
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase

      # 4. Run the ETL script using your hidden GitHub secrets
      - name: Run ETL Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/update_prayers.py